# CatchiMediaStudio production Worker. It uses only Cloudflare AI, KV and Queues.
name = "catchimediastudio2-o"
main = "dist/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "METADATA"
id = "90754c58723443dc8bc5248a0f5873fa"

# Queue messages contain only opaque job IDs; prompts and small text outputs stay in KV.
[[queues.producers]]
binding = "GENERATION_QUEUE"
queue = "catchimedia-studio-jobs"

[[queues.consumers]]
queue = "catchimedia-studio-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
retry_delay = 15
dead_letter_queue = "catchimedia-studio-dlq"

[[queues.consumers]]
queue = "catchimedia-studio-dlq"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 1

[vars]
APP_VERSION = "2.1.0"
GITHUB_OWNER = "VuDube"
GITHUB_REPO = "CatchiMediaStudio2.O"
