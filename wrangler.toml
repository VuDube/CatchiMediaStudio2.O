# CatchiMediaStudio2.O — Wrangler configuration
name = "catchimediastudio2-o"
main = "dist/worker.js"
compatibility_date = "2026-01-01"

# ------------------------------------------------------------------
# Workers AI binding (free tier: 10,000 neurons/day)
# ------------------------------------------------------------------
[ai]
binding = "AI"

# ------------------------------------------------------------------
# Workers KV metadata store (free tier: 1 GB, 100k reads/day)
# Namespace ID is provisioned and locked to this account.
# ------------------------------------------------------------------
[[kv_namespaces]]
binding = "METADATA"
id = "90754c58723443dc8bc5248a0f5873fa"

# ------------------------------------------------------------------
# Cron Triggers: process the KV job queue every minute; the worker
# also runs asset lifecycle cleanup on the 00:xx UTC pass.
# ------------------------------------------------------------------
[triggers]
crons = ["* * * * *"]

# ------------------------------------------------------------------
# Non-secret configuration. Secrets (GITHUB_TOKEN, GROQ_API_KEY,
# HF_TOKEN) are set via the Cloudflare dashboard or wrangler-action
# `secrets:` input — never committed here.
# ------------------------------------------------------------------
[vars]
GITHUB_OWNER = "VuDube"
GITHUB_REPO = "CatchiMediaStudio2.O"
