name: CatchiMediaStudio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catchi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, audit and validate the Worker/PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and bundled Worker contract tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Wrangler production bundle dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
