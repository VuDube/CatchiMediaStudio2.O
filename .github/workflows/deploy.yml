name: Deploy to Cloudflare Workers

# Browser-first CI/CD: deploys on every push to main AND on demand
# from the GitHub Actions tab (workflow_dispatch) — no CLI required.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: 'deploy'

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy CatchiMediaStudio2.O
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build worker (inline studio UI)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Optional secrets — created in the Cloudflare dashboard or
          # listed here so wrangler-action pushes repo-secret values
          # into the Worker on every deploy:
          secrets: |
            GITHUB_TOKEN
            GROQ_API_KEY
            HF_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.ASSET_GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
