name: Legacy Release Asset Audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Report legacy asset count without deleting files
    runs-on: ubuntu-latest
    steps:
      - name: Inspect legacy release metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/catchi-media-assets" > /tmp/release.json; then
            count=$(jq '.assets | length' /tmp/release.json)
            oldest=$(jq -r '[.assets[].created_at] | sort | .[0] // "none"' /tmp/release.json)
            {
              echo "## Legacy release audit"
              echo "Assets present: $count"
              echo "Oldest created-at timestamp: $oldest"
              echo "No assets were downloaded, listed by filename, modified or deleted."
              echo "The repository is public; legacy Release asset URLs may be public too."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No legacy release found; no assets were changed." >> "$GITHUB_STEP_SUMMARY"
          fi
